<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
{{BASE_CSS}}

.layout {
  flex: 1;
  display: grid;
  gap: 3mm;
  min-height: 0;
}

/* 1 photo */
.layout[data-count="1"] {
  grid-template-columns: 1fr;
  grid-template-rows: 1fr;
}
.layout[data-count="1"] .photo-0 { grid-area: 1 / 1 / 2 / 2; }

/* 2 photos: big left, smaller right */
.layout[data-count="2"] {
  grid-template-columns: 3fr 2fr;
  grid-template-rows: 1fr;
}
.layout[data-count="2"] .photo-0 { grid-area: 1 / 1 / 2 / 2; }
.layout[data-count="2"] .photo-1 { grid-area: 1 / 2 / 2 / 3; }

/* 3 photos: big left, two stacked right */
.layout[data-count="3"] {
  grid-template-columns: 3fr 2fr;
  grid-template-rows: 1fr 1fr;
}
.layout[data-count="3"] .photo-0 { grid-area: 1 / 1 / 3 / 2; }
.layout[data-count="3"] .photo-1 { grid-area: 1 / 2 / 2 / 3; }
.layout[data-count="3"] .photo-2 { grid-area: 2 / 2 / 3 / 3; }

/* 4 photos: big center-left, three around */
.layout[data-count="4"] {
  grid-template-columns: 3fr 2fr;
  grid-template-rows: 1fr 1fr 1fr;
}
.layout[data-count="4"] .photo-0 { grid-area: 1 / 1 / 3 / 2; }
.layout[data-count="4"] .photo-1 { grid-area: 1 / 2 / 2 / 3; }
.layout[data-count="4"] .photo-2 { grid-area: 2 / 2 / 3 / 3; }
.layout[data-count="4"] .photo-3 { grid-area: 3 / 1 / 4 / 3; }

/* 5 photos: big center top, four below */
.layout[data-count="5"] {
  grid-template-columns: 3fr 2fr;
  grid-template-rows: 2fr 1fr 1fr;
}
.layout[data-count="5"] .photo-0 { grid-area: 1 / 1 / 2 / 3; }
.layout[data-count="5"] .photo-1 { grid-area: 2 / 1 / 3 / 2; }
.layout[data-count="5"] .photo-2 { grid-area: 2 / 2 / 3 / 3; }
.layout[data-count="5"] .photo-3 { grid-area: 3 / 1 / 4 / 2; }
.layout[data-count="5"] .photo-4 { grid-area: 3 / 2 / 4 / 3; }

/* 6+ photos: big top-left, rest in dynamic grid */
.layout[data-count="6"] {
  grid-template-columns: 1fr 1fr 1fr;
  grid-template-rows: 2fr 1fr;
}
.layout[data-count="6"] .photo-0 { grid-area: 1 / 1 / 2 / 3; }
.layout[data-count="6"] .photo-1 { grid-area: 1 / 3 / 2 / 4; }
.layout[data-count="6"] .photo-2 { grid-area: 2 / 1 / 3 / 2; }
.layout[data-count="6"] .photo-3 { grid-area: 2 / 2 / 3 / 3; }
.layout[data-count="6"] .photo-4 { grid-area: 2 / 3 / 3 / 4; }
.layout:not([data-count="1"]):not([data-count="2"]):not([data-count="3"]):not([data-count="4"]):not([data-count="5"]):not([data-count="6"]) {
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: 2fr repeat(2, 1fr);
}
.layout:not([data-count="1"]):not([data-count="2"]):not([data-count="3"]):not([data-count="4"]):not([data-count="5"]):not([data-count="6"]) .photo-0 {
  grid-area: 1 / 1 / 2 / 3;
}

.photo-slot {
  overflow: hidden;
  border-radius: 2mm;
  background: #f0f0f0;
  min-height: 0;
}
</style>
</head>
<body>
<div class="page">
  {{#if TITLE}}<div class="page-title">{{TITLE}}</div>{{/if}}
  <div class="layout" data-count="{{COUNT}}">
    {{PHOTOS}}
  </div>
</div>
</body>
</html>
