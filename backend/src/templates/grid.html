<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
{{BASE_CSS}}

.layout {
  flex: 1;
  display: grid;
  gap: 3mm;
  grid-template-columns: repeat({{COLS}}, 1fr);
  grid-auto-rows: 1fr;
  min-height: 0;
}

.photo-slot {
  overflow: hidden;
  border-radius: 2mm;
  background: #f0f0f0;
  min-height: 0;
}
</style>
</head>
<body>
<div class="page">
  {{#if TITLE}}<div class="page-title">{{TITLE}}</div>{{/if}}
  <div class="layout">
    {{PHOTOS}}
  </div>
</div>
</body>
</html>
