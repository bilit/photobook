services:
  - type: web
    name: photobook
    runtime: node
    buildCommand: PUPPETEER_CACHE_DIR=/opt/render/project/src/backend/.cache/puppeteer npm run install:all && npm run build
    startCommand: node backend/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/src/backend/.cache/puppeteer
      - key: BACKEND_URL
        sync: false
