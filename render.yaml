services:
  - type: web
    name: photobook
    runtime: node
    buildCommand: npm run install:all && npx --prefix backend puppeteer browsers install chrome && npm run build
    startCommand: node backend/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: BACKEND_URL
        sync: false
